name: Publish grip-core to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to verify
        required: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      # pnpm.overrides maps @owebeeone/glade-decl to file:../glade-decl-ts, so
      # the install needs that checkout beside this one.
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: workspace/grip-core
      - uses: actions/checkout@v6
        with:
          repository: owebeeone/glade-decl-ts
          path: workspace/glade-decl-ts
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: workspace/grip-core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: workspace/grip-core
      - run: pnpm test
        working-directory: workspace/grip-core
      - run: pnpm build
        working-directory: workspace/grip-core
      # The consumer resolves @owebeeone/glade-decl@^0.1.0 from the registry,
      # so glade-decl must be published before this release is cut.
      - name: Smoke-test packed consumer install
        working-directory: workspace/grip-core
        run: |
          package_dir=$(mktemp -d)
          pnpm pack --pack-destination "$package_dir"
          package_tarball="owebeeone-grip-core-$(node -p "require('./package.json').version").tgz"
          mkdir "$package_dir/consumer"
          cd "$package_dir/consumer"
          echo '{ "name": "consumer", "private": true, "type": "module" }' > package.json
          pnpm add "$package_dir/$package_tarball" typescript@5.9.3
          node --input-type=module -e "const m = await import('@owebeeone/grip-core'); if (!m.Grok || !m.Grip || !m.AtomValueTap) { throw new Error('missing public grip-core export'); }"
          echo 'import type { Tap } from "@owebeeone/grip-core"; export type Checked = NonNullable<Tap["share"]>["shape"];' > check.ts
          pnpm exec tsc --noEmit --strict --module nodenext --skipLibCheck false check.ts
          # node16 reads the import condition's own types, index.d.mts; with
          # one CommonJS index.d.ts for both, it refused the ESM-only glade-decl (TS1479).
          pnpm exec tsc --noEmit --strict --module node16 --skipLibCheck false check.ts

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: workspace/grip-core
      - uses: actions/checkout@v6
        with:
          repository: owebeeone/glade-decl-ts
          path: workspace/glade-decl-ts
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        working-directory: workspace/grip-core
      # pnpm publish packs and then hands the tarball to the npm CLI on PATH,
      # so that CLI decides the auth methods available.
      - name: Select an npm CLI with trusted-publishing support
        run: npm install --global npm@latest
      - name: Require tag/package version agreement
        working-directory: workspace/grip-core
        run: |
          node -e 'const p=require("./package.json"); const t=process.env.RELEASE_TAG.replace(/^v/, ""); if (p.version !== t) throw new Error(`package ${p.version} != tag ${t}`)'
      # grip-core has no prepack, so build here; pnpm publish packs dist as built.
      - run: pnpm build
        working-directory: workspace/grip-core
      - name: Publish if this immutable version is absent
        working-directory: workspace/grip-core
        env:
          # A token is needed until npm Trusted Publishing is configured for
          # this package and publish.yml; then remove this secret and npm will
          # use the job's OIDC token automatically.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_spec=$(node -p "const p=require('./package.json'); p.name + '@' + p.version")
          if pnpm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published"
          else
            pnpm publish --access public --no-git-checks
          fi
